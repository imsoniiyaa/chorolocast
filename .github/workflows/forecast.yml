name: Daily Forecast

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
         pip install scipy numpy pandas "timesfm==2.0.2" "torch==2.15.0" "chronos-forecasting==2.3.2"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages('png', repos='https://cran.rstudio.com/')"
          Rscript -e "install.packages('reticulate', repos='https://cran.rstudio.com/')"
          Rscript -e "install.packages(c('forecast', 'ranger', 'readr', 'dplyr', 'tidyr', 'httr', 'jsonlite'), repos='https://cran.rstudio.com/')"

      - name: Cache TimesFM model
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: timesfm-model-v1

      - name: Update data from VERA
        run: |
          Rscript R/update_data.R

      - name: Check data dates
        run: |
          Rscript -e "
          library(readr)
          df <- read_csv('chla_daily.csv', show_col_types = FALSE)
          df\$date <- as.Date(df\$date)
          cat('Last date:', as.character(max(df\$date, na.rm=TRUE)), '\n')
          cat('Today:', as.character(Sys.Date()), '\n')
          cat('Lag:', as.numeric(Sys.Date() - max(df\$date, na.rm=TRUE)), 'days\n')
          "

      - name: Set Python path for reticulate
        run: |
          echo "RETICULATE_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: Run evaluate
        continue-on-error: true
        run: |
          Rscript R/fm.R evaluate \
            --data chla_daily.csv \
            --models persistence arima rf timesfm chronos ens3 \
            --stride 3 \
            --out results_all5

      - name: Check data dates
        run: |
          Rscript /tmp/check.R || true
          cat > /tmp/check.R << 'REOF'
          library(readr)
          df <- read_csv('chla_daily.csv', show_col_types = FALSE)
          df$date <- as.Date(df$date)
          chla <- df$Chla_ugL_mean
          cat('Non-NA Chla values:', sum(!is.na(chla)), '\n')
          cat('Last non-NA date:', as.character(max(df$date[!is.na(chla)], na.rm=TRUE)), '\n')
          REOF
          Rscript /tmp/check.R
      - name: Run forecast
        run: |
          python py/ens4.py forecast \
            --data chla_daily.csv \
            --out forecasts

      - name: Commit and push
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git pull --rebase origin main
          git add chla_daily.csv forecasts/ results_all5/
          git commit -m "auto forecast $(date +'%Y-%m-%d')" || echo "No changes"
          git push
